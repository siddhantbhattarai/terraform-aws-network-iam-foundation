<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Secure network and IAM foundation architecture</title>
  <desc id="desc">A two-availability-zone VPC with public and private subnets, optional NAT gateway, flow logs, and IAM workload identity.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#e7effb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#16345e" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#3970b5"/></marker></defs>
  <rect width="1280" height="720" rx="26" fill="url(#bg)"/><text x="58" y="64" fill="#10233d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Secure AWS Network &amp; IAM Foundation</text><text x="58" y="94" fill="#5b6b80" font-family="Arial,sans-serif" font-size="17">Two-AZ network segmentation, explicit routing, observability, and least-privilege workload identity</text>
  <rect x="55" y="140" width="1170" height="510" rx="22" fill="#dbeafe" stroke="#8ab6ed" stroke-width="2"/><text x="85" y="180" fill="#1553a2" font-family="Arial,sans-serif" font-size="21" font-weight="700">VPC · 10.20.0.0/16</text>
  <rect x="90" y="212" width="500" height="380" rx="16" fill="#f8fbff" stroke="#a9c9ef"/><text x="115" y="248" fill="#29588d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Availability Zone A</text><rect x="120" y="278" width="200" height="110" rx="12" fill="#fff3d9" filter="url(#shadow)"/><text x="220" y="325" text-anchor="middle" fill="#9a5a00" font-family="Arial,sans-serif" font-size="18" font-weight="700">Public subnet</text><text x="220" y="354" text-anchor="middle" fill="#765b35" font-family="Arial,sans-serif" font-size="14">Internet gateway route</text><rect x="355" y="278" width="200" height="110" rx="12" fill="#e9f8ef" filter="url(#shadow)"/><text x="455" y="325" text-anchor="middle" fill="#157146" font-family="Arial,sans-serif" font-size="18" font-weight="700">Private subnet</text><text x="455" y="354" text-anchor="middle" fill="#4a755e" font-family="Arial,sans-serif" font-size="14">No direct internet route</text><rect x="355" y="430" width="200" height="105" rx="12" fill="#eff4fb" filter="url(#shadow)"/><text x="455" y="472" text-anchor="middle" fill="#29588d" font-family="Arial,sans-serif" font-size="17" font-weight="700">Workload identity</text><text x="455" y="499" text-anchor="middle" fill="#5b6b80" font-family="Arial,sans-serif" font-size="14">IAM role + security group</text>
  <rect x="635" y="212" width="500" height="380" rx="16" fill="#f8fbff" stroke="#a9c9ef"/><text x="660" y="248" fill="#29588d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Availability Zone B</text><rect x="665" y="278" width="200" height="110" rx="12" fill="#fff3d9" filter="url(#shadow)"/><text x="765" y="325" text-anchor="middle" fill="#9a5a00" font-family="Arial,sans-serif" font-size="18" font-weight="700">Public subnet</text><text x="765" y="354" text-anchor="middle" fill="#765b35" font-family="Arial,sans-serif" font-size="14">Internet gateway route</text><rect x="900" y="278" width="200" height="110" rx="12" fill="#e9f8ef" filter="url(#shadow)"/><text x="1000" y="325" text-anchor="middle" fill="#157146" font-family="Arial,sans-serif" font-size="18" font-weight="700">Private subnet</text><text x="1000" y="354" text-anchor="middle" fill="#4a755e" font-family="Arial,sans-serif" font-size="14">No direct internet route</text><rect x="665" y="430" width="435" height="105" rx="12" fill="#f0edff" filter="url(#shadow)"/><text x="882" y="472" text-anchor="middle" fill="#5d43a2" font-family="Arial,sans-serif" font-size="17" font-weight="700">VPC Flow Logs → CloudWatch Logs</text><text x="882" y="499" text-anchor="middle" fill="#665b80" font-family="Arial,sans-serif" font-size="14">Accepted and rejected traffic is auditable</text>
  <path d="M20 315H105" stroke="#3970b5" stroke-width="4" marker-end="url(#arrow)"/><text x="20" y="290" fill="#3970b5" font-family="Arial,sans-serif" font-size="15" font-weight="700">Internet</text><path d="M320 333H345" stroke="#3970b5" stroke-width="3" marker-end="url(#arrow)"/><text x="438" y="625" text-anchor="middle" fill="#5b6b80" font-family="Arial,sans-serif" font-size="14">Optional NAT gateway provides outbound private-subnet access (disabled by default)</text>
</svg>
